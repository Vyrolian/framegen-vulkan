name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trace-producer:
    name: Trace producer contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up portable Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Reject protected licensed inputs and binary payloads
        run: ./scripts/test-protected-inputs.sh
      - name: Exercise safe capture staging and sanitization
        run: ./scripts/test-capture-trace.sh
      - name: Check local release-candidate verification
        if: runner.os == 'Linux'
        run: ./scripts/test-release-candidate.sh
  repository-tools:
    name: Repository tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Test diagnostics helper
        run: python3 -I scripts/tests/test_diagnostics_helper.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked Markdown tooling
        run: npm ci

      - name: Check Markdown formatting
        run: npm run format:markdown:check

  renderer:
    name: MAKO Renderer (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: gcc
            cc: gcc
            cxx: g++
          - toolchain: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Renderer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ clang \
            libvulkan-dev libx11-dev libxcb1-dev

      - name: Fetch the native package Vulkan headers
        run: |
          revision="$(cat engine/vulkan-headers-revision.txt)"
          git clone --depth=1 --branch "$revision" \
            https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/mako-vulkan-headers"
          echo "CXXFLAGS=-I$RUNNER_TEMP/mako-vulkan-headers/include" >> "$GITHUB_ENV"

      - name: Configure Renderer tests
        run: >-
          cmake -S engine -B engine/build/ci-${{ matrix.toolchain }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DMAKO_BUILD_VK_LAYER=ON
          -DMAKO_BUILD_CLI=ON
          -DMAKO_REQUIRE_NATIVE_PACKAGE_HEADERS=ON
          -DMAKO_GPU_QUALITY_TEST=OFF

      - name: Build Renderer and test executables
        run: cmake --build engine/build/ci-${{ matrix.toolchain }}

      - name: Run Renderer tests
        run: ctest --test-dir engine/build/ci-${{ matrix.toolchain }} --output-on-failure

  renderer-sanitizers:
    name: MAKO Renderer (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: gcc
      CXX: g++
      MAKO_ENABLE_SANITIZERS: ON
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Confirm hosted sanitizer toolchain
        run: |
          for command in cmake ctest gcc g++; do
            command -v "$command" >/dev/null || {
              echo "Required hosted-runner command is missing: $command" >&2
              exit 1
            }
          done

      - name: Install sanitizer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libx11-dev libxcb1-dev

      - name: Fetch the shared Vulkan headers
        run: |
          revision="$(cat engine/vulkan-headers-revision.txt)"
          git clone --depth=1 --branch "$revision" \
            https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/mako-vulkan-headers"
          echo "CXXFLAGS=-I$RUNNER_TEMP/mako-vulkan-headers/include" >> "$GITHUB_ENV"

      - name: Run sanitized portable policy tests
        working-directory: engine
        run: ./scripts/test-adaptive-scheduler.sh
