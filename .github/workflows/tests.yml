name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected-inputs:
    name: Protected-input and release-candidate checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up portable Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Reject protected licensed inputs and binary payloads
        run: ./scripts/test-protected-inputs.sh
      - name: Check local release-candidate verification
        if: runner.os == 'Linux'
        run: ./scripts/test-release-candidate.sh
  fgvk-ui:
    name: fgvk settings launcher
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install settings launcher build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libx11-dev libgl-dev libegl-dev

      - name: Run settings launcher tests
        working-directory: engine/fgvk-ui
        run: cargo test --locked

      - name: Build settings launcher
        working-directory: engine/fgvk-ui
        run: cargo build --locked

  renderer:
    name: framegen-vulkan (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: gcc
            cc: gcc
            cxx: g++
          - toolchain: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Renderer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ clang \
            libvulkan-dev libx11-dev libxcb1-dev

      - name: Fetch the native package Vulkan headers
        run: |
          revision="$(cat engine/vulkan-headers-revision.txt)"
          git clone --depth=1 --branch "$revision" \
            https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/fgvk-vulkan-headers"
          echo "CXXFLAGS=-I$RUNNER_TEMP/fgvk-vulkan-headers/include" >> "$GITHUB_ENV"

      - name: Configure Renderer tests
        run: >-
          cmake -S engine -B engine/build/ci-${{ matrix.toolchain }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DFGVK_BUILD_VK_LAYER=ON
          -DFGVK_BUILD_CLI=ON
          -DFGVK_REQUIRE_NATIVE_PACKAGE_HEADERS=ON

      - name: Build Renderer and test executables
        run: cmake --build engine/build/ci-${{ matrix.toolchain }}

      - name: Run Renderer tests
        run: ctest --test-dir engine/build/ci-${{ matrix.toolchain }} --output-on-failure

  renderer-sanitizers:
    name: framegen-vulkan (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: gcc
      CXX: g++
      FGVK_ENABLE_SANITIZERS: ON
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Confirm hosted sanitizer toolchain
        run: |
          for command in cmake ctest gcc g++; do
            command -v "$command" >/dev/null || {
              echo "Required hosted-runner command is missing: $command" >&2
              exit 1
            }
          done

      - name: Install sanitizer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libx11-dev libxcb1-dev

      - name: Fetch the shared Vulkan headers
        run: |
          revision="$(cat engine/vulkan-headers-revision.txt)"
          git clone --depth=1 --branch "$revision" \
            https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/fgvk-vulkan-headers"
          echo "CXXFLAGS=-I$RUNNER_TEMP/fgvk-vulkan-headers/include" >> "$GITHUB_ENV"

      - name: Run sanitized portable policy tests
        working-directory: engine
        run: ./scripts/test-adaptive-scheduler.sh
