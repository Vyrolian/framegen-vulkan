name: Release build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-archive:
    name: framegen-vulkan Linux release archive (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      archive: ${{ steps.archive.outputs.archive }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          # Full history: the build fingerprint reads the last commit that touched engine/, and the
          # archive timestamp reads the HEAD commit time. A shallow clone can change either one.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify version and release tag
        run: |
          version="$(tr -d '[:space:]' < engine/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "Tag $GITHUB_REF_NAME must match engine/VERSION (v$version)." >&2
              exit 1
            fi
            git merge-base --is-ancestor HEAD origin/main
            node scripts/read-release-notes.mjs engine/RELEASE_NOTES.md framegen-vulkan "$version" >/dev/null
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils clang-14 g++-multilib \
            cmake ninja-build git python3 pkg-config xz-utils \
            libvulkan-dev libx11-dev libxcb1-dev \
            libwayland-dev libxkbcommon-dev libgl-dev libegl-dev
          mkdir -p "$RUNNER_TEMP/fgvk-toolchain"
          ln -s /usr/bin/clang-14 "$RUNNER_TEMP/fgvk-toolchain/clang"
          ln -s /usr/bin/clang++-14 "$RUNNER_TEMP/fgvk-toolchain/clang++"
          echo "$RUNNER_TEMP/fgvk-toolchain" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          uname -srm
          ldd --version | head -n 1
          clang++ --version | head -n 1
          g++ --version | head -n 1
          cmake --version | head -n 1
          ninja --version
          python3 --version
          cargo --version
          rustc --version

      - name: Fetch the pinned Vulkan headers for tests and packaging
        run: |
          revision="$(cat engine/vulkan-headers-revision.txt)"
          headers="$RUNNER_TEMP/fgvk-vulkan-headers"
          git clone --depth=1 --branch "$revision" https://github.com/KhronosGroup/Vulkan-Headers "$headers"
          git -C "$headers" rev-parse HEAD
          echo "CXXFLAGS=-I$headers/include" >> "$GITHUB_ENV"
          echo "FGVK_VULKAN_HEADERS_INCLUDE_DIR=$headers/include" >> "$GITHUB_ENV"

      - name: Run repository gates
        run: scripts/dev.sh test-all

      - name: Build the release archive natively
        run: scripts/dev.sh package-engine

      - name: Verify the packaged binaries on Ubuntu 22.04
        run: |
          version="$(tr -d '[:space:]' < engine/VERSION)"
          mkdir "$RUNNER_TEMP/fgvk-package"
          tar -xJf "engine/out/framegen-vulkan-v${version}-linux.tar.xz" -C "$RUNNER_TEMP/fgvk-package"
          cd "$RUNNER_TEMP/fgvk-package"
          sha256sum --check --quiet framegen-vulkan-install-manifest.txt
          for binary in bin/fgvk bin/fgvk-cli lib/libfgvk-render.so lib32/libfgvk-render.so; do
            glibc="$(readelf --version-info "$binary" | awk '/Name: GLIBC_[0-9]/ {for (i=1; i<NF; ++i) if ($i == "Name:") print $(i+1)}' | sort -V | tail -n 1)"
            echo "$binary requires $glibc"
            if [[ -z "$glibc" || "$(printf '%s\n' "$glibc" GLIBC_2.35 | sort -V | tail -n 1)" != GLIBC_2.35 ]]; then
              exit 1
            fi
            dependencies="$(ldd "$binary")"
            if [[ "$dependencies" == *'not found'* ]]; then
              printf '%s\n' "$dependencies" >&2
              exit 1
            fi
          done
          bin/fgvk /usr/bin/true

      - name: Write and verify the SHA-256 file
        id: archive
        run: |
          version="$(tr -d '[:space:]' < engine/VERSION)"
          archive="framegen-vulkan-v${version}-linux.tar.xz"
          test -s "engine/out/$archive"
          (
            cd engine/out
            sha256sum "$archive" > "$archive.sha256"
            sha256sum --check "$archive.sha256"
          )
          cat "engine/out/$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload the archive and its SHA-256 file
        uses: actions/upload-artifact@v7
        with:
          name: framegen-vulkan-linux
          path: |
            engine/out/${{ steps.archive.outputs.archive }}
            engine/out/${{ steps.archive.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  flatpak-archive:
    name: framegen-vulkan Flatpak extensions
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      archive: ${{ steps.archive.outputs.archive }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Flatpak build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils flatpak flatpak-builder xz-utils
          flatpak --version
          flatpak-builder --version

      - name: Build and verify Flatpak extensions
        run: scripts/dev.sh package-flatpaks

      - name: Write and verify the SHA-256 file
        id: archive
        working-directory: engine/out
        run: |
          version="$(tr -d '[:space:]' < ../VERSION)"
          archive="framegen-vulkan-v${version}-flatpaks.tar.xz"
          test -s "$archive"
          sha256sum "$archive" > "$archive.sha256"
          sha256sum --check "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload the Flatpak archive and its SHA-256 file
        uses: actions/upload-artifact@v7
        with:
          name: framegen-vulkan-flatpaks
          path: |
            engine/out/${{ steps.archive.outputs.archive }}
            engine/out/${{ steps.archive.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Linux and Flatpak packages to GitHub Releases
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [release-archive, flatpak-archive]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download the verified Linux archive
        uses: actions/download-artifact@v8
        with:
          name: framegen-vulkan-linux
          path: release-assets

      - name: Download the verified Flatpak archive
        uses: actions/download-artifact@v8
        with:
          name: framegen-vulkan-flatpaks
          path: release-assets

      - name: Create the GitHub release
        env:
          LINUX_ARCHIVE: ${{ needs.release-archive.outputs.archive }}
          FLATPAK_ARCHIVE: ${{ needs.flatpak-archive.outputs.archive }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum --check "$LINUX_ARCHIVE.sha256" "$FLATPAK_ARCHIVE.sha256"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "framegen-vulkan $GITHUB_REF_NAME" \
            --notes-file ../engine/RELEASE_NOTES.md \
            "$LINUX_ARCHIVE" "$LINUX_ARCHIVE.sha256" "$FLATPAK_ARCHIVE" "$FLATPAK_ARCHIVE.sha256"
